# Pipeline : à chaque push sur main, on vérifie le code puis on publie le site sur GitHub Pages.
name: Vérifier et déployer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verifier:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntaxe JavaScript
        run: for f in kit.js people.js app.js; do node --check "$f"; done
      - name: Tests du catalogue et des fichiers
        run: node test.js

  deployer:
    name: Déploiement GitHub Pages
    needs: verifier
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Préparer les fichiers du site
        run: |
          mkdir dist
          cp index.html kit.js people.js app.js manifest.json icon.svg icon-512.png icon-180.png dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
